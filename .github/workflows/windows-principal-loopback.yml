name: Windows principal loopback control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  principal-loopback:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.100
      - name: Record release and cross-principal transport control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $dotnet = (Get-Command dotnet).Source
          $sdk = (& dotnet --version).Trim()
          if ($sdk -ne '11.0.100') { throw "Unexpected SDK: $sdk" }
          Write-Host "SDK=$sdk"
          Write-Host "DotnetSha256=$((Get-FileHash $dotnet -Algorithm SHA256).Hash)"
          Write-Host "RunnerImage=$env:ImageOS $env:ImageVersion"

          $nonce = [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $actorName = "h4actor$nonce"
          $password = [Guid]::NewGuid().ToString('N') + 'aA1!'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = [pscredential]::new("$env:COMPUTERNAME\$actorName", $secure)
          $marker = Join-Path $env:USERPROFILE "h4-owner-$nonce.txt"
          $script = Join-Path $env:PUBLIC "h4-actor-$nonce.ps1"
          $result = Join-Path $env:PUBLIC "h4-result-$nonce.txt"
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          try {
            New-LocalUser -Name $actorName -Password $secure -Description 'Ephemeral loopback control account' | Out-Null
            @'
          param([int]$Port, [string]$Marker, [string]$Result)
          $ErrorActionPreference = 'Stop'
          $direct = 'denied'
          try {
            Set-Content -LiteralPath $Marker -Value 'actor direct write' -ErrorAction Stop
            $direct = 'allowed'
          } catch {}
          $client = [Net.Sockets.TcpClient]::new()
          try {
            $client.Connect([Net.IPAddress]::Loopback, $Port)
            $bytes = [Text.Encoding]::UTF8.GetBytes('H4-SAFE')
            $stream = $client.GetStream()
            $stream.Write($bytes, 0, $bytes.Length)
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            Set-Content -LiteralPath $Result -Value "actor=$identity; direct=$direct; connected=true"
          } finally {
            $client.Dispose()
          }
          '@ | Set-Content -LiteralPath $script -Encoding utf8

            $listener.Start()
            $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
            $pending = $listener.AcceptTcpClientAsync()
            $arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$script`" -Port $port -Marker `"$marker`" -Result `"$result`""
            $process = Start-Process -FilePath 'powershell.exe' -Credential $credential -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Actor exited $($process.ExitCode)" }
            if (-not $pending.Wait([TimeSpan]::FromSeconds(15))) { throw 'Actor did not connect' }
            $peer = $pending.Result
            try {
              $buffer = New-Object byte[] 16
              $count = $peer.GetStream().Read($buffer, 0, $buffer.Length)
              $message = [Text.Encoding]::UTF8.GetString($buffer, 0, $count)
            } finally {
              $peer.Dispose()
            }
            $actorResult = (Get-Content -LiteralPath $result -Raw).Trim()
            if ($actorResult -notmatch 'direct=denied; connected=true') { throw "Bad control: $actorResult" }
            if (Test-Path -LiteralPath $marker) { throw 'Actor could write owner marker' }
            if ($message -ne 'H4-SAFE') { throw "Unexpected loopback message: $message" }
            Set-Content -LiteralPath $marker -Value 'owner received safe loopback message'
            Write-Host "Owner=$owner"
            Write-Host $actorResult
            Write-Host 'CrossPrincipalLoopback=true; OwnerOnlyMarker=true'
          } finally {
            $listener.Stop()
            Remove-Item -LiteralPath $script, $result, $marker -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $actorName -ErrorAction SilentlyContinue
          }
