name: Windows WPF JSON Frame control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpf-control:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.100
      - name: Run inert deserialization control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((dotnet --version).Trim() -ne '11.0.100') { throw 'SDK version mismatch' }
          Write-Host "RunnerImage=$env:ImageOS $env:ImageVersion"
          dotnet run --project lab/wpf-jsonframe-control/WpfJsonFrameControl.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
