name: Windows WPF encrypted validation

on:
  push:
    branches:
      - lab/h4-wpf-jsonframe-20261120

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.100
      - name: Run encrypted controlled validation
        shell: pwsh
        env:
          H4_VALIDATION_KEY: ${{ secrets.H4_VALIDATION_KEY }}
        run: ./scripts/run-wpf-encrypted.ps1
      - name: Retain encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wpf-encrypted-evidence
          path: wpf-encrypted-evidence.bin
          if-no-files-found: warn
          retention-days: 1
